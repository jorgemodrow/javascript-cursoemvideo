<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Douaumento</title>
    <style>
        body {
            background-color: lightcoral;
            font: normal 20pt arial
        }
        input {
            height: 40px;
        }
        div#resultado {
            margin-top: 20px;
            background: whitesmoke;
            width: 200pt;
            height: 200pt;
            text-align: center;
            line-height: 200pt;
        }
    </style>
</head>
<body>
    <h3>Hey Manos!</h3>
    <p>Escolha <strong>dois valores</strong> que o sistema somará para você!</p>
    <input type="number" name="num1" id="num1"> <strong> + </strong>
    <input type="number" name="num2" id="num2">
    <input type="button" value="Somar" onclick="somar()">
    <div id="resultado"></div>

    <script>
        function somar() {
            var num1 = document.getElementById('num1')
            var num2 = document.getElementById('num2')
            var n1 = Number(num1.value)
            var n2 = Number(num2.value)
            var s = n1 + n2
            var res = document.querySelector('div#resultado')
            res.innerHTML = `<strong>${s}</strong>`
            res.addEventListener('click', clicar)

            function clicar() {
            res.style.color = 'green'
            }
        }
    </script>
</body>
</html>
