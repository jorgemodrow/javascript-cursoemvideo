<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nome</title>
    <style>
        body {
            background-color:indigo;
            color:white;
            font: normal 17pt arial;
        }
    </style>
</head>
<body>
    <h1>a</h1>
    <script>
        var nome = window.prompt('qual seu nome?')
        var sobrenome = window.prompt('qual o seu sobrenome?')
        var pessoa = nome + ` ` + sobrenome
        var h1 = document.querySelector('h1')
        h1.innerHTML = `Oi, ${nome}! Seja bem-vindo ao decifrador de nomes`
        document.write(`Seu nome é ${pessoa}.`)
    </script>
</body>
</html>
