<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN Palmeira</title>
    <style>
        body {
            font: normal 15pt arial;
            background-color: rgb(234, 234, 234);
        }

        h1 {
            margin-left: 7pt;
            display: inline;
            width: 100%;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font: normal 30pt arial;
            background-image: linear-gradient(to right, black 0%, black 75%, gray 75%, gray 100% )
        }

        h3 {
            margin-left: 8pt;
            margin-top: -4pt;
            color: gray;
            font: normal 8.2pt arial
        }

        div#linha {
            font: bold 15pt arial;
            background-color: white;
            width: 500pt;
            text-align: center;
            height: 50pt;
            line-height: 50pt;
            margin-left: 7pt;
            border-radius: 5pt; /* borda arredondada */
        }

        input#ver {
            background:rgb(82, 190, 40);
            color: white;
            height: 30pt;
            width: 100pt;
            font: bold 10pt arial;
            border-radius: 5pt;
            border: 0pt;
            margin-left: 10pt
        }

        div#res {
            margin-left: 6pt;
            margin-top: 10pt;
        }

        input#kmh {
            border-width: thin;
            border-style: solid;
            border-color: black;
            border-radius: 2pt;
            height: 15pt;
            width: 100pt;
        }
    </style>
</head>
<body>
    <h1><strong>DETRAN PR</strong></h1>
    <h3>DEPARTAMENTO DE TRÂNSITO DO PARANÁ</h3>
    <div id="linha">Digite sua velocidade: <input type="number" name="kmh" id="kmh"> km/h <input type="button" value="Verificar" id="ver" onclick="verificar()" onmouseenter="entrar()" onmouseout="sair()" onmousedown="segurar()"></div>
    <div id="res"></div>
    <script>
        var h1 = document.querySelector('h1')
        var ver = document.querySelector('input#ver')
        function entrar() {
            ver.style.background = 'green'
        }
        function sair() {
            ver.style.background = 'rgb(82, 190, 40)'
        }
        function segurar() {
            ver.style.border = 'thin'
            ver.style.borderColor = 'black'
        }
        function verificar() {
            var km = document.querySelector('input#kmh')
            var kmh = km.value
            var res = document.querySelector('div#res')
            if (kmh > 60) {
                res.style.color = 'black'
                res.innerHTML = `Sua velocidade atual é de <strong>${kmh}km/h</strong>`
                res.innerHTML += `<p>Você está <strong>multado</strong> por excesso de velocidade!</p>`
                res.innerHTML += `<p>Dirija sempre com cinto de segurança.</p>`
                km.style.borderColor = 'black'
            } else if (kmh <= 0) {
                res.style.color = 'red'
                res.innerHTML = 'Velocidade inválida!</br>'
                km.style.borderColor = 'red'
            } else if (kmh.length < 1) {
                res.style.color = 'red'
                res.innerHTML = 'Preencha este campo.</br>'
                km.style.borderColor = 'red'
            } else {
                res.innerHTML = `Sua velocidade atual é de <strong>${kmh}km/h</strong></br>`
                res.style.color = 'black'
                res.innerHTML += `<p>Dirija sempre com cinto de segurança.</p>`
                km.style.borderColor = 'black'
            }
        }
    </script>
</body>
</html>
